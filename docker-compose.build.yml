# Overlay that builds the image from this checkout instead of pulling it from
# Docker Hub. Maintainers only; deployments should use docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Build args default to the values the published image was built with, so a
# local build is comparable. Override them in the environment:
#
#   PI_VERSION=1.5.0 INSTALL_OPENCODE=true \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml build

x-build: &build
  context: .
  args:
    PI_VERSION: ${PI_VERSION:-1.4.0}
    NODE_VERSION: ${NODE_VERSION:-22.23.3}
    GH_VERSION: ${GH_VERSION:-2.80.0}
    OP_CLI_REF: ${OP_CLI_REF:-259f293a}
    INSTALL_OPENCODE: ${INSTALL_OPENCODE:-false}
    OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.4}

services:
  engine:
    build: *build
  dashboard:
    build: *build
  cleanup:
    build: *build
  provision:
    build: *build
  check-config:
    build: *build

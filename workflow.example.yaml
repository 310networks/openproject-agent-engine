# op-agent-engine workflow configuration
#
# Copy to <checkout>/workflow.yaml and adjust, then run ./install.sh.
# The installer copies it to ~/.config/op-agent-engine/workflow.yaml.
# ${VAR} references are resolved from the service environment (engine.env).
# A missing variable is a startup error.
#
# Placeholders available inside runner argv/cwd/stdin_file:
#   {prompt_file} {repo_dir} {workspace_dir} {run_dir}
#   {model} {branch} {work_package_id}
#
# {model} is optional. Set it per agent (`model:` under an agent) or once per
# runner (`model:` under a runner, used by every agent that does not set its
# own). When no model is configured the {model} placeholder AND the flag in
# front of it are dropped from argv, so ["--model", "{model}"] falls back to
# the agent CLI's own default model instead of passing an empty string.

openproject:
  # Names must match the OpenProject instance exactly (case-sensitive).
  statuses:
    new: "New"
    in_progress: "In Progress"
    ready_for_review: "Ready for Review"
    in_testing: "In Testing"
    on_hold: "On Hold"
    rejected: "Rejected"
    closed: "Closed"
  agent_field: "AGENT"            # custom field name; resolved to customField<N> at startup
  engine_user: "agent-engine"     # login of the engine user
  provisioning:                   # M8; used only by provision/check-config
    enabled: true
    agent_role: "Agent Worker"     # role name on this instance (create manually)
    email_domain: "agent-engine.local"   # only used when creating a missing user
  dispatch_priority: [ready_for_review, rejected, new]   # finish work before starting new work
  eligible_types: ["Task", "Bug", "Feature"]
  skip_work_packages_with_children: true
  skip_if_assigned_to_human: true

projects:
  - identifier: "example-project"   # OpenProject project identifier
    repo:
      github: "310networks/example-project"
      dir: "example-project"   # clone directory name under <workspace>/repositories/
      default_branch: "main"
    enabled: true

agents:
  FRONTEND:
    name: frontendEngineer
    kind: implementer
    op_login: "frontendEngineer"
    workspace: "frontendEngineer"          # under WORKSPACE_ROOT
    projects: ["*"]                        # M8 scope; ["*"] = every enabled project
    runner: pi
    model: null                            # optional; overrides the runner's model
    timeout_seconds: 3600
    env:
      # Verified: the OpenProject CLI (`op`) reads OP_CLI_HOST and OP_CLI_TOKEN.
      # OP_CLI_PROFILE selects a different profile from ~/.config/openproject/config.
      OP_CLI_HOST: "${OP_BASE_URL}"
      OP_CLI_TOKEN: "${OP_TOKEN_FRONTEND}"
  BACKEND:
    name: backendEngineer
    kind: implementer
    op_login: "backendEngineer"
    workspace: "backendEngineer"
    projects: ["*"]
    runner: pi
    env:
      OP_CLI_HOST: "${OP_BASE_URL}"
      OP_CLI_TOKEN: "${OP_TOKEN_BACKEND}"
  LEAD_DESIGNER:
    name: leadDesigner
    kind: implementer
    op_login: "leadDesigner"
    workspace: "leadDesigner"
    projects: ["*"]
    runner: pi
    env:
      OP_CLI_HOST: "${OP_BASE_URL}"
      OP_CLI_TOKEN: "${OP_TOKEN_DESIGNER}"
  REVIEWER:
    name: codeReviewer
    kind: reviewer
    op_login: "codeReviewer"
    workspace: "codeReviewer"
    projects: ["*"]
    runner: pi
    env:
      OP_CLI_HOST: "${OP_BASE_URL}"
      OP_CLI_TOKEN: "${OP_TOKEN_REVIEWER}"
    # Future: add GH_TOKEN here to give the reviewer a dedicated GitHub account.

runners:
  pi:
    # Verified against pi 1.4.0: -p is print mode, @file attaches the prompt,
    # --approve trusts project-local resources (print mode cannot prompt).
    # pi does not ask for approval before tool calls.
    # --model {model} selects the model; leave it unset to use pi's default.
    #
    # --no-extensions    do not load the host's pi extensions (pi-dashboard and
    #                    the built-in MCP/llama.cpp/codemode/tool-search ones).
    #                    An unattended run must be minimal: extension startup
    #                    can block or hang a print-mode run.
    # --no-context-files do not load ~/.pi/agent/AGENTS.md (the host's personal
    #                    agent instructions), a repository AGENTS.md, or any
    #                    other discovered context file. The workspace standard
    #                    below is the only standing context; the agent reads
    #                    repository files it needs explicitly.
    argv: ["pi", "-p", "--approve", "--no-extensions", "--no-context-files",
           "--model", "{model}", "@{prompt_file}", "Follow the instructions in the attached prompt file."]
    model: null                    # e.g. "anthropic/claude-sonnet-4-5"
    cwd: "{repo_dir}"
    env: {}                        # pi still uses the host's provider credentials
    inject_standard: true          # --no-context-files disables AGENTS.md discovery
  opencode:
    # Verified against opencode 1.18.4: `run` is non-interactive, -f/--file
    # attaches the prompt, --auto approves permissions that are not denied.
    argv: ["opencode", "run", "--auto", "--model", "{model}", "--file", "{prompt_file}", "Follow the instructions in the attached prompt file."]
    model: null                    # e.g. "anthropic/claude-sonnet-4-5" (provider/model)
    cwd: "{repo_dir}"
    env: {}
    inject_standard: true          # do not rely on parent-directory discovery
  generic_stdin:
    argv: ["my-agent", "--non-interactive"]
    stdin_file: "{prompt_file}"
    cwd: "{repo_dir}"
    inject_standard: true

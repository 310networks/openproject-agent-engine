[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "op-agent-engine"
version = "0.1.0"
description = "Polls OpenProject work packages and dispatches coding agents to work on them"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "Jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
op-agent-engine = "op_agent_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/op_agent_engine"]

# Ship the configuration examples and unit templates inside the package so
# `init` and `install-service` work from any install method (uv tool, pipx,
# venv). The repository files in the root and under deploy/ stay the source of
# truth.
[tool.hatch.build.targets.wheel.force-include]
"workflow.example.yaml" = "op_agent_engine/examples/workflow.example.yaml"
"engine.env.example" = "op_agent_engine/examples/engine.env.example"
"deploy/op-agent-engine.service" = "op_agent_engine/examples/units/op-agent-engine.service"
"deploy/op-agent-engine-cleanup.service" = "op_agent_engine/examples/units/op-agent-engine-cleanup.service"
"deploy/op-agent-engine-cleanup.timer" = "op_agent_engine/examples/units/op-agent-engine-cleanup.timer"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["op_agent_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Docker Compose deployment of the agent engine.
#
# Every Docker artifact lives in this directory, and deployment is pull-only:
# nothing is built here. Configuration is environment variables, read from the
# .env file next to this file (or from docker/agent-init.sh, which writes it)
# and passed straight into the containers:
#
#   ./agent-init.sh                 # creates .env: users, tokens, model, key
#   docker compose pull && docker compose up -d
#   docker compose logs -f engine
#
# Nothing is mounted from the host: provider credentials and settings are
# environment variables in .env, and all state lives in named volumes, so the
# container user never has to match a host UID and the whole directory can be
# copied to another machine as-is.
#
#   OP_AGENT_ENGINE_TAG=0.2.4 docker compose up -d    # pin a version,
#                                                    # default is `latest`
#
# The image itself is built and published by .github/workflows/docker.yml;
# see docs/DOCKER.md.

name: op-agent-engine

x-engine: &engine
  # Published by .github/workflows/docker.yml; the tag comes from
  # docker/version.json.
  image: kookster310/op-agent-engine:${OP_AGENT_ENGINE_TAG:-latest}
  env_file:
    # Written by ./agent-init.sh (mode 0600). Optional so the setup script
    # script can run before it exists.
    - path: .env
      required: false
  volumes:
    # pi state: model cache, sessions, logs, downloaded tools.
    - pi-agent:/home/agent/.pi/agent
    # Engine state: SQLite store, run directories, heartbeat, engine lock.
    - engine-data:/home/agent/.local/share/op-agent-engine
    # Agent workspaces: AGENTS.md standards (synced from the image at start)
    # plus the git clones.
    - agent-workspace:/home/agent/agents
  restart: unless-stopped
  # STOP_GRACE_SECONDS (60) + the runner's 20 s SIGKILL grace, with margin.
  stop_grace_period: 90s

services:
  engine:
    <<: *engine
    container_name: op-agent-engine
    command: ["run"]

  # Read-only dashboard. It has no authentication, so publish it on loopback
  # and reach it through a reverse proxy if it must be remote.
  dashboard:
    <<: *engine
    container_name: op-agent-engine-dashboard
    command: ["dashboard"]
    depends_on:
      - engine
    ports:
      # Keep DASHBOARD_PORT=8765 in .env: this publishes 8765.
      - "${DASHBOARD_BIND:-127.0.0.1}:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-shot tasks. `cleanup` is what you schedule from cron on the host:
  #   0 4 * * *  cd /opt/op-agent-engine && docker compose run --rm cleanup
  cleanup:
    <<: *engine
    profiles: ["tasks"]
    restart: "no"
    command: ["cleanup"]

  # Creates or reconciles the engine and agent users in OpenProject (writes
  # enabled). ./agent-init.sh does this, and the token interview, for you.
  #   docker compose run --rm provision
  provision:
    <<: *engine
    profiles: ["tasks"]
    restart: "no"
    command: ["provision", "--apply", "--json"]

  # Validates the environment variables without a poll. Any other command can
  # be run the same way; the argument overrides the service command:
  #   docker compose run --rm engine status --json
  check-config:
    <<: *engine
    profiles: ["tasks"]
    restart: "no"
    command: ["check-config"]

volumes:
  pi-agent:
  engine-data:
  agent-workspace:
